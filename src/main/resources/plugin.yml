name: Create-Railways-Dynmap-Bridge
version: 1.0.0.2
main: com.igrobar.createdynmap.CreateRailwaysDynmapBridge
api-version: '1.21'
softdepend: [dynmap]
author: igrobar
description: Publishes Create railway stations and trains to Dynmap with automatic world detection and configurable world mappings.
commands:
  getstations:
    description: Get a list of all Create stations or export them.
    permission: create.stations.admin
    usage: /getstations