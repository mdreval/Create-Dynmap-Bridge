name: Create-Railways-Dynmap-Bridge
version: 1.0.0.7
main: com.igrobar.createdynmap.CreateRailwaysDynmapBridge
api-version: '1.21'
softdepend: [dynmap]
author: igrobar
description: Publishes Create railway stations and trains to Dynmap and to a live web map, with automatic world detection and configurable world mappings.
commands:
  getstations:
    description: Get a list of all Create stations or export them.
    permission: create.stations.admin
    usage: /getstations
  gettrains:
    description: Get a list of all Create trains or export them.
    permission: create.stations.admin
    usage: /gettrains
  railmap:
    description: Show the link to the live web map of Create trains.
    aliases: [trainmap]
    permission: create.railmap
    usage: /railmap
permissions:
  create.railmap:
    description: Allows /railmap (link to the live web map).
    default: true
  create.stations.admin:
    description: Allows /getstations and /gettrains.
    default: op
